<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BimGo: first-person BIM walkthroughs in the browser." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BimGo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101318; color: #f4f5f7; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #fatal { display: none; position: fixed; inset: 0; padding: 56px; font: 16px/1.5 Bahnschrift, 'Segoe UI', system-ui, sans-serif; }
      #fatal h1 { font-size: 40px; letter-spacing: 4px; margin: 0 0 16px; }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="fatal"><h1>BIMGO</h1><p id="fatal-message"></p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
